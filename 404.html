<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — The Tale of Her</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#FAF6F1; --ink:#2E1810; --stone:#AE9789; --apricot-deep:#B77B6E; }
  *{box-sizing:border-box;margin:0;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;text-align:center;padding:24px;}
  .f{font-family:'Fraunces',serif;}
  
  h1{font-weight:300;font-size:clamp(2.4rem,7vw,4.5rem);line-height:1.05;margin-bottom:20px;}
  p{color:#6B5147;font-size:15px;line-height:1.7;max-width:380px;margin:0 auto 36px;}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  a.btn{display:inline-block;padding:14px 28px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
        text-decoration:none;transition:background .35s,color .35s;}
  .solid{background:var(--ink);color:var(--paper);} .solid:hover{background:var(--apricot-deep);}
  .ghost{border:1px solid var(--ink);color:var(--ink);} .ghost:hover{background:var(--ink);color:var(--paper);}
</style>
</head>
<body>
  <div>
    <img src="/logo.png" alt="The Tale of Her" style="width:220px;height:auto;margin:0 auto 44px;display:block;">
    <h1 class="f">This page has <span style="color:var(--apricot-deep);font-style:italic">wandered off.</span></h1>
    <p>The page you're looking for doesn't exist — but the collection is still here, waiting.</p>
    <div class="btns">
      <a class="btn solid" href="/">Back to Home</a>
      <a class="btn ghost" href="/katalog.html">View Catalog</a>
    </div>
  </div>
</body>
</html>
